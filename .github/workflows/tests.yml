name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: trigger-warnings --help
      - run: trigger-warnings --subtitles examples/dialogue.srt --events examples/events.json --output example.warned.ass
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the built wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/trigger-warnings" --version
          "$RUNNER_TEMP/wheel-check/bin/trigger-warnings" \
            --subtitles "$GITHUB_WORKSPACE/examples/dialogue.srt" \
            --events "$GITHUB_WORKSPACE/examples/events.json" \
            --output "$RUNNER_TEMP/wheel-example.ass"
  vision-install:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[vision]'
      - run: python -m pip check
      - name: Check optional imports (no model download or GPU required)
        run: python -c 'from mlx_vlm import load, generate; from mlx_vlm.prompt_utils import apply_chat_template; import av; from PIL import Image'
      - run: python -m unittest discover -s tests -p test_vision.py -v
      - run: python -m unittest discover -s tests -p test_video.py -v
