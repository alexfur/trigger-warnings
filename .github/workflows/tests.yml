name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (with libass)
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Verify Python toolchain
        shell: bash
        run: |
          set -euo pipefail
          python --version
      - name: Create venv and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m unittest discover -s tests -v
      - name: Install package
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m pip install --quiet .
      - name: Verify CLI
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          trigger-warnings --help
      - name: Run example
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          trigger-warnings \
            --subtitles examples/dialogue.srt \
            --events examples/events.json \
            --output example.warned.ass

  package:
    name: Package & Wheel Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --quiet --upgrade build twine
          python -m build
          twine check dist/*
      - name: Verify wheel installation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/trigger-warnings" --version
          "$RUNNER_TEMP/wheel-check/bin/trigger-warnings" \
            --subtitles "$GITHUB_WORKSPACE/examples/dialogue.srt" \
            --events "$GITHUB_WORKSPACE/examples/events.json" \
            --output "$RUNNER_TEMP/wheel-example.ass"

  vision-install:
    name: Vision Extra (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (with libass)
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install vision extras and verify imports
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --quiet '.[vision]'
          python -m pip check
          python -c 'from mlx_vlm import load, generate; from mlx_vlm.prompt_utils import apply_chat_template; import av; from PIL import Image'
      - name: Run vision tests
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m unittest discover -s tests -p test_vision.py -v
      - name: Run video tests
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m unittest discover -s tests -p test_video.py -v

  gemini-install:
    name: Gemini Extra (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gemini extras and verify imports
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --quiet '.[gemini]'
          python -m pip check
          python -c 'from google import genai; from google.genai import types; from pydantic import BaseModel'
      - name: Run gemini tests
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m unittest discover -s tests -p 'test_gemini*.py' -v
