name: Publish to PyPI

# Tags stage on TestPyPI. Production publication is an explicit dispatch.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions: {}

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.target || 'testpypi' }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  publish:
    needs: check
    runs-on: [self-hosted, macOS]
    environment:
      name: ${{ inputs.target || 'testpypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v python3.12
          python3.12 --version
      - name: Create venv and install build tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          python3.12 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade build twine
      - name: Require a version tag matching both package versions
        shell: bash
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          . .venv/bin/activate
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          from trigger_warnings import __version__
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_REF_TYPE"] == "tag", "Dispatch on a version tag, not a branch"
          assert os.environ["RELEASE_TAG"] == "v" + version, "Tag and metadata differ"
          assert __version__ == version, "Runtime and metadata versions differ"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("RELEASE_VERSION=" + version + "\n")
          PY
      - name: Build staging distributions
        if: inputs.target != 'pypi'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          . .venv/bin/activate
          python -m build
      - name: Retrieve the staged distributions for production
        if: inputs.target == 'pypi'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          . .venv/bin/activate
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.request import urlopen
          version = os.environ["RELEASE_VERSION"]
          with urlopen("https://test.pypi.org/pypi/trigger-warnings/" + version + "/json") as response:
              files = json.load(response)["urls"]
          assert {item["packagetype"] for item in files} == {"sdist", "bdist_wheel"}
          Path("dist").mkdir()
          for item in files:
              filename = item["filename"]
              assert Path(filename).name == filename
              with urlopen(item["url"]) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == item["digests"]["sha256"]
              (Path("dist") / filename).write_bytes(data)
          PY
      - name: Twine check
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          . .venv/bin/activate
          python -m twine check dist/*
      - name: Test the distribution being published
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          python3.12 -m venv "$RUNNER_TEMP/publish-check"
          "$RUNNER_TEMP/publish-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/publish-check/bin/trigger-warnings" --version
          "$RUNNER_TEMP/publish-check/bin/trigger-warnings" \
            --subtitles "$GITHUB_WORKSPACE/examples/dialogue.srt" \
            --events "$GITHUB_WORKSPACE/examples/events.json" \
            --output "$RUNNER_TEMP/publish-example.ass"
      - name: Publish to TestPyPI
        if: inputs.target != 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish the same distributions to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
