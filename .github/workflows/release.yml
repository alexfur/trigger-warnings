name: Publish to PyPI

# Only a vX.Y.Z tag publishes. Anything without two dots is ignored, so a
# branch tag or a scratch tag cannot reach PyPI.
on:
  push:
    tags:
      - 'v*.*.*'

# No job gets a token unless it asks. The publish job below asks for the two
# permissions it needs and nothing else.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trigger-warnings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
