name: Feature request
description: Something the tool should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the
        [roadmap](https://github.com/alexfur/trigger-warnings/blob/main/ROADMAP.md)
        first. Scene detection, a safety score and video editing are
        deliberately not planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What are you watching, and what goes wrong today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: Optional.
