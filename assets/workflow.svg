<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="tw-title tw-desc">
  <title id="tw-title">trigger-warnings workflow: your files in, a planned dry run, warned subtitles out</title>
  <desc id="tw-desc">Three stages, left to right. Stage one, you supply: a dialogue SRT file, either one you already have or one fetched from OpenSubtitles with --os-file, and an events JSON file, or your own DoesTheDogDie API key and an item ID. Stage two, the agent plans: a dry run validates the inputs, resolves your categories, reports the warning windows and writes nothing. Stage three, the tool writes: a warned ASS or SRT subtitle file and a JSON provenance sidecar, carrying warning cues with your dialogue kept, as new files that never overwrite anything. Timestamps come from you, never from the tool, and a warning ending is not an all-clear.</desc>

  <style>
    .bg   { fill: #ffffff; stroke: #d0d7de; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .rule { stroke: #d8dee4; }
    .head { fill: #1f2328; }
    .mono { fill: #115e59; }
    .mute { fill: #57606a; }
    .badge{ fill: #115e59; }
    .bnum { fill: #ffffff; }
    .arrw { fill: #57606a; stroke: #57606a; }

    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; stroke: #30363d; }
      .card { fill: #161b22; stroke: #30363d; }
      .rule { stroke: #30363d; }
      .head { fill: #e6edf3; }
      .mono { fill: #5eead4; }
      .mute { fill: #9198a1; }
      .badge{ fill: #2dd4bf; }
      .bnum { fill: #06302b; }
      .arrw { fill: #8b949e; stroke: #8b949e; }
    }

    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .t-head { font-size: 13.5px; font-weight: 600; }
    .t-mono { font-size: 12px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .t-mute { font-size: 11.5px; }
    .t-num  { font-size: 11.5px; font-weight: 700; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="879" height="279" rx="14"/>

  <!-- Stage 1: You supply -->
  <rect class="card" x="24.5" y="24.5" width="247" height="191" rx="10"/>
  <circle class="badge" cx="55" cy="51" r="11"/>
  <text class="t-num bnum" x="55" y="55" text-anchor="middle">1</text>
  <text class="t-head head" x="76" y="56">You supply</text>
  <line class="rule" x1="44" y1="74" x2="252" y2="74"/>
  <text class="t-mono mono" x="44" y="100">dialogue.srt</text>
  <text class="t-mute mute" x="140" y="100">or --os-file ID</text>
  <text class="t-mono mono" x="44" y="122">events.json</text>
  <line class="rule" x1="44" y1="140" x2="134" y2="140"/>
  <text class="t-mute mute" x="148" y="144" text-anchor="middle">or</text>
  <line class="rule" x1="162" y1="140" x2="252" y2="140"/>
  <text class="t-mono mono" x="44" y="166">DDD_API_KEY</text>
  <text class="t-mono mono" x="44" y="188">--ddd-item ID</text>

  <!-- Arrow 1 -->
  <line class="arrw" x1="280" y1="120" x2="300" y2="120" stroke-width="2"/>
  <path class="arrw" d="M300 113.5 L313 120 L300 126.5 Z"/>

  <!-- Stage 2: Agent plans -->
  <rect class="card" x="316.5" y="24.5" width="247" height="191" rx="10"/>
  <circle class="badge" cx="347" cy="51" r="11"/>
  <text class="t-num bnum" x="347" y="55" text-anchor="middle">2</text>
  <text class="t-head head" x="368" y="56">Agent plans</text>
  <line class="rule" x1="336" y1="74" x2="544" y2="74"/>
  <text class="t-mono mono" x="336" y="100">--dry-run</text>
  <text class="t-mute mute" x="336" y="122">validates the inputs</text>
  <text class="t-mute mute" x="336" y="144">resolves your categories</text>
  <text class="t-mute mute" x="336" y="166">reports the warning windows</text>
  <text class="t-mute mute" x="336" y="188">writes nothing</text>

  <!-- Arrow 2 -->
  <line class="arrw" x1="572" y1="120" x2="592" y2="120" stroke-width="2"/>
  <path class="arrw" d="M592 113.5 L605 120 L592 126.5 Z"/>

  <!-- Stage 3: Tool writes -->
  <rect class="card" x="608.5" y="24.5" width="247" height="191" rx="10"/>
  <circle class="badge" cx="639" cy="51" r="11"/>
  <text class="t-num bnum" x="639" y="55" text-anchor="middle">3</text>
  <text class="t-head head" x="660" y="56">Tool writes</text>
  <line class="rule" x1="628" y1="74" x2="836" y2="74"/>
  <text class="t-mono mono" x="628" y="100">movie.warned.ass</text>
  <text class="t-mono mono" x="628" y="122">movie.provenance.json</text>
  <line class="rule" x1="628" y1="144" x2="836" y2="144"/>
  <text class="t-mute mute" x="628" y="166">warning cues, dialogue kept</text>
  <text class="t-mute mute" x="628" y="188">new files only, never overwritten</text>

  <text class="t-mute mute" x="440" y="252" text-anchor="middle">Timestamps come from you, never from the tool. A warning ending is not an all-clear.</text>
</svg>
