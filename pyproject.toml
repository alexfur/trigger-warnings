[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trigger-warnings"
version = "0.2.0"
description = "Add advance warnings to dialogue subtitles using supplied event timestamps"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Alex Furman"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
trigger-warnings = "trigger_warnings.cli:main"

[tool.setuptools.packages.find]
include = ["trigger_warnings*"]
