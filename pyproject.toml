[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trigger-warnings"
version = "0.4.0a3"
description = "Spoiler-free trigger warnings for local video"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alex Furman"}]
dependencies = []
keywords = ["subtitles", "trigger-warnings", "accessibility", "srt", "ass", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
# Local model scanning is opt-in and currently targets Apple Silicon through
# MLX. Keep the base subtitle tool dependency-free and cheap to install.
vision = [
    "mlx-vlm>=0.7,<0.8",
    "torchvision>=0.29,<0.30",
    "av>=14,<17",
]
gemini = [
    "google-genai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/alexfur/trigger-warnings"
Repository = "https://github.com/alexfur/trigger-warnings"
Issues = "https://github.com/alexfur/trigger-warnings/issues"
Changelog = "https://github.com/alexfur/trigger-warnings/blob/main/CHANGELOG.md"

[project.scripts]
trigger-warnings = "trigger_warnings.cli:main"

[tool.setuptools.packages.find]
include = ["trigger_warnings*"]
